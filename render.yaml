databases:
  - name: agrosense-postgres
    plan: free
    region: oregon
    postgresMajorVersion: "17"

services:
  - type: keyvalue
    name: agrosense-redis
    plan: free
    region: oregon
    ipAllowList: []

  - type: web
    name: agrosense-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile.prod
    dockerContext: ./server
    plan: free
    region: oregon
    # main.ts applies app.setGlobalPrefix('api/v1') to every route,
    # including health — the real endpoint is /api/v1/health, not /health.
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: agrosense-postgres
          property: connectionString
      # These individual fields feed ./typeOrm.config.ts (the CLI migration
      # datasource), which is a separate file from the NestJS module config
      # above and reads discrete host/port/user/pass rather than a URL.
      - key: POSTGRES_HOST
        fromDatabase:
          name: agrosense-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: agrosense-postgres
          property: port
      - key: POSTGRES_USER
        fromDatabase:
          name: agrosense-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: agrosense-postgres
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: agrosense-postgres
          property: database
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agrosense-redis
          property: connectionString
      - key: CORS_ORIGIN
        # TODO: update this once agrosense-client deploys and its real
        # URL is confirmed — Render will likely assign a random suffix
        # here too, the same way it did for agrosense-server (-mrib).
        value: https://agrosense-client.onrender.com
      - key: FRONTEND_URL
        # Same TODO as CORS_ORIGIN above — update together.
        value: https://agrosense-client.onrender.com
      # Remaining secrets (JWT secrets, SMTP, Africa's Talking, FCM, GROQ,
      # weather API) are marked sync: false so Render prompts you to fill
      # them in via the dashboard rather than committing them here.
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_VERIFICATION_TOKEN_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WEATHER_API_URL
        sync: false
      - key: AFRICAS_TALKING_USERNAME
        sync: false
      - key: AFRICAS_TALKING_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        sync: false
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_CLIENT_EMAIL
        sync: false
      - key: FCM_PRIVATE_KEY
        sync: false

  - type: web
    name: agrosense-client
    runtime: docker
    dockerfilePath: ./client/Dockerfile.prod
    dockerContext: ./client
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Next's standalone server.js binds to process.env.HOSTNAME if set,
      # falling back to 0.0.0.0 otherwise. Render sets its own HOSTNAME
      # pointing at the container's internal name, which overrides that
      # default and makes the app listen on an address nothing external
      # can reach. Forcing it here overrides Render's value back to
      # 0.0.0.0 so the app actually accepts outside connections.
      - key: HOSTNAME
        value: "0.0.0.0"
      # Render assigned agrosense-server a -mrib suffix rather than the
      # plain name — using the real confirmed URL here, not a guess.
      - key: NEXT_PUBLIC_API_URL
        value: https://agrosense-server-mrib.onrender.com/api/v1