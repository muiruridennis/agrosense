databases:
  - name: agrosense-postgres
    plan: free
    region: oregon
    postgresMajorVersion: "17"

services:
  - type: keyvalue
    name: agrosense-redis
    plan: free
    region: oregon
    ipAllowList: []  # Allow all connections (Render internal)

  - type: web
    name: agrosense-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile.prod
    dockerContext: ./server
    plan: free
    region: oregon
    healthCheckPath: /health
    # ✅ Remove PORT env var - Render provides it automatically
    dockerCommand: sh -c "npm run migration:run && node dist/main.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agrosense-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agrosense-redis
          property: connectionString
      - key: CORS_ORIGIN
        value: https://agrosense-client.onrender.com
      # ✅ Add this for server-side session management
      - key: COOKIE_SECURE
        value: "true"
      # Secrets (sync: false = set in dashboard)
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_VERIFICATION_TOKEN_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WEATHER_API_URL
        sync: false
      - key: AFRICAS_TALKING_USERNAME
        sync: false
      - key: AFRICAS_TALKING_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        sync: false
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_CLIENT_EMAIL
        sync: false
      - key: FCM_PRIVATE_KEY
        sync: false

  - type: web
    name: agrosense-client
    runtime: docker
    dockerfilePath: ./client/Dockerfile.prod
    dockerContext: ./client
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://agrosense-server.onrender.com/api/v1